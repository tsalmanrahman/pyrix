<!-- =========================================================================
     UNIVERSAL UNSAVED CHANGES WARNING MODAL
     Intercepts Back navigation and page exits when form changes are unsaved
     ========================================================================= -->
<div id="modal-unsaved-changes" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[999] hidden items-center justify-center p-4">
  <div class="glass-card rounded-2xl p-6 max-w-md w-full border border-amber-500/30 shadow-2xl space-y-4 bg-slate-900/95 text-slate-100">
    <div class="flex items-start gap-3.5">
      <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
      </div>
      <div>
        <h3 class="text-sm font-bold text-white tracking-tight">Unsaved Changes Detected</h3>
        <p class="text-xs text-slate-300 mt-1 leading-relaxed">
          You have made modifications to this record that haven't been saved. If you leave now, your changes will be discarded.
        </p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-white/5">
      <button 
        type="button" 
        id="btn-keep-editing" 
        onclick="dismissUnsavedModal()" 
        class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 transition cursor-pointer"
      >
        Keep Editing
      </button>
      <button 
        type="button" 
        id="btn-discard-and-leave" 
        onclick="confirmDiscardNavigation()" 
        class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-sm transition cursor-pointer"
      >
        Discard &amp; Leave
      </button>
    </div>
  </div>
</div>
