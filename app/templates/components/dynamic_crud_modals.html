<!-- Universal Dynamic Edit & Delete Action Modals -->

<!-- 1. Universal Dynamic Edit Modal -->
<div id="modal-dynamic-edit" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden transition-opacity duration-200" aria-modal="true" role="dialog">
  <div class="glass-card w-full max-w-2xl rounded-3xl p-6 border border-slate-200 dark:border-white/10 shadow-2xl space-y-6 relative overflow-hidden bg-white/95 dark:bg-[#161A23]/95 max-h-[90vh] flex flex-col">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-sm">
          <i data-lucide="pencil" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="dynamic-edit-title" class="text-base font-bold text-slate-900 dark:text-white">Edit Record</h3>
          <p id="dynamic-edit-subtitle" class="text-xs text-slate-500 dark:text-slate-400">Modify properties and persist directly to database</p>
        </div>
      </div>
      <button type="button" onclick="closeDynamicEditModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Form Content (Scrollable if tall) -->
    <form id="dynamic-edit-form" onsubmit="submitDynamicEditForm(event)" class="space-y-4 overflow-y-auto flex-1 pr-1 custom-scrollbar">
      <input type="hidden" id="dynamic-edit-entity" value="">
      <input type="hidden" id="dynamic-edit-id" value="">

      <!-- Loading Spinner Skeleton -->
      <div id="dynamic-edit-loading" class="py-12 flex flex-col items-center justify-center space-y-3">
        <div class="w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-slate-400 font-medium">Retrieving record metadata...</p>
      </div>

      <!-- Dynamic Fields Container -->
      <div id="dynamic-fields-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Modal Actions Footer -->
      <div class="pt-4 border-t border-slate-100 dark:border-white/5 flex items-center justify-end gap-3">
        <button type="button" onclick="closeDynamicEditModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5 transition">
          Cancel
        </button>
        <button type="submit" id="btn-save-dynamic-edit" class="mac-btn-primary px-5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- 2. Universal Dynamic Delete Confirmation Modal -->
<div id="modal-dynamic-delete" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden transition-opacity duration-200" aria-modal="true" role="dialog">
  <div class="glass-card w-full max-w-md rounded-3xl p-6 border border-slate-200 dark:border-white/10 shadow-2xl space-y-5 text-center bg-white/95 dark:bg-[#161A23]/95 relative overflow-hidden">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-500/10 text-rose-600 dark:text-rose-400 flex items-center justify-center shadow-sm">
      <i data-lucide="trash-2" class="w-7 h-7"></i>
    </div>

    <div>
      <h3 class="text-base font-bold text-slate-900 dark:text-white">Confirm Deletion</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
        Are you sure you want to delete <span id="dynamic-delete-title" class="font-bold text-slate-900 dark:text-white">this record</span>?
      </p>
    </div>

    <!-- Relational Blocked Warning Banner -->
    <div id="dynamic-delete-blocked" class="hidden p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-left text-xs space-y-1">
      <div class="flex items-center gap-1.5 font-bold text-amber-600 dark:text-amber-400">
        <i data-lucide="shield-alert" class="w-4 h-4"></i>
        <span>Relational Integrity Guardrail Active</span>
      </div>
      <p id="dynamic-delete-blocked-msg" class="text-[11px] text-slate-600 dark:text-slate-300"></p>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-center gap-3 pt-2">
      <button type="button" onclick="closeDynamicDeleteModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5 transition">
        Cancel
      </button>
      <button type="button" id="btn-execute-delete" onclick="executeDynamicDelete()" class="px-5 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white shadow-lg shadow-rose-600/25 flex items-center gap-2 transition transform hover:scale-105">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        <span>Delete</span>
      </button>
    </div>
  </div>
</div>

<!-- 3. Universal Dynamic View Details Modal -->
<div id="modal-dynamic-view" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden transition-opacity duration-200" aria-modal="true" role="dialog">
  <div class="glass-card w-full max-w-xl rounded-3xl p-6 border border-slate-200 dark:border-white/10 shadow-2xl space-y-5 relative overflow-hidden bg-white/95 dark:bg-[#161A23]/95 max-h-[90vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-sm">
          <i data-lucide="eye" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="dynamic-view-title" class="text-base font-bold text-slate-900 dark:text-white">Record Details</h3>
          <p id="dynamic-view-subtitle" class="text-xs text-slate-500 dark:text-slate-400">Read-only entity specifications</p>
        </div>
      </div>
    </div>

    <!-- Loading Skeleton -->
    <div id="dynamic-view-loading" class="py-12 flex flex-col items-center justify-center space-y-3">
      <div class="w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-slate-400 font-medium">Retrieving record details...</p>
    </div>

    <!-- Details Grid -->
    <div id="dynamic-view-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 overflow-y-auto flex-1 pr-1 custom-scrollbar hidden">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Footer -->
    <div class="pt-4 border-t border-slate-100 dark:border-white/5 flex items-center justify-end gap-3">
      <button type="button" id="btn-view-to-edit" onclick="switchToEditFromView()" class="mac-btn-primary px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md">
        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
        <span>Edit</span>
      </button>
    </div>
  </div>
</div>

<!-- 4. Universal Floating Row Action Menu Popover -->
<div 
  id="floating-row-action-menu" 
  class="fixed z-[9999] hidden w-44 rounded-2xl bg-white/95 dark:bg-[#161A23]/95 border border-slate-200 dark:border-white/10 shadow-2xl p-1.5 space-y-0.5 backdrop-blur-xl transition-all"
  style="box-shadow: 0 20px 40px -10px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.06);"
>
  <button 
    type="button" 
    onclick="handleActionMenuClick('view')" 
    class="w-full flex items-center gap-2.5 px-2.5 py-1.5 text-xs font-medium rounded-xl text-slate-700 dark:text-slate-200 hover:bg-blue-500/10 hover:text-blue-600 dark:hover:text-blue-400 transition cursor-pointer"
  >
    <i data-lucide="eye" class="w-3.5 h-3.5 text-blue-500 shrink-0"></i>
    <span>View</span>
  </button>
  <button 
    type="button" 
    onclick="handleActionMenuClick('edit')" 
    class="w-full flex items-center gap-2.5 px-2.5 py-1.5 text-xs font-medium rounded-xl text-slate-700 dark:text-slate-200 hover:bg-amber-500/10 hover:text-amber-600 dark:hover:text-amber-400 transition cursor-pointer"
  >
    <i data-lucide="pencil" class="w-3.5 h-3.5 text-amber-500 shrink-0"></i>
    <span>Edit</span>
  </button>
  <div class="h-px bg-slate-100 dark:border-white/5 my-1"></div>
  <button 
    type="button" 
    onclick="handleActionMenuClick('delete')" 
    class="w-full flex items-center gap-2.5 px-2.5 py-1.5 text-xs font-semibold rounded-xl text-rose-600 dark:text-rose-400 hover:bg-rose-500/10 transition cursor-pointer"
  >
    <i data-lucide="trash-2" class="w-3.5 h-3.5 text-rose-500 shrink-0"></i>
    <span>Delete</span>
  </button>
</div>

<!-- 5. Universal Toast Notification Container -->
<div id="dynamic-toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
