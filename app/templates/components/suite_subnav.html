<!-- DYNAMIC SUITE-CONTEXTUAL SUB-NAVIGATION BAR (System-Wide Universal Component) -->
{% if active_suite and active_suite.cards and active_suite.cards|length > 1 %}
  <div id="subnav-container" class="relative group/subnav flex items-center w-full min-w-full">

    <!-- Left Navigation Chevron (Auto-hidden when at start or no overflow) -->
    <button 
      id="subnav-btn-left"
      type="button"
      onclick="scrollSuiteSubnav('left')"
      class="subnav-nav-btn absolute left-1 z-30 w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-white/95 dark:bg-slate-800/95 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 dark:hover:text-white border border-slate-200 dark:border-white/15 text-slate-700 dark:text-slate-200 shadow-md flex items-center justify-center transition-all duration-200 cursor-pointer disabled:opacity-0 disabled:pointer-events-none hover:scale-105 active:scale-95 shrink-0"
      title="Previous Pages"
      style="display: none;"
    >
      <i data-lucide="chevron-left" class="w-4 h-4"></i>
    </button>

    <!-- Left Gradient Fade Mask -->
    <div id="subnav-fade-left" class="subnav-fade-mask absolute left-0 top-0 bottom-0 w-10 bg-gradient-to-r from-white dark:from-[#161A23] to-transparent z-20 pointer-events-none rounded-l-2xl opacity-0 transition-opacity duration-200" style="display: none;"></div>

    <!-- Scrollable Track (Zero Scrollbar) -->
    <div id="dynamic-suite-subnav" class="glass-card subnav-content-aware no-scrollbar rounded-2xl p-2 border border-slate-200 dark:border-white/10 flex items-center justify-between gap-2 overflow-x-auto text-xs font-semibold shadow-sm w-full min-w-full max-w-full">
      <div class="flex items-center gap-1.5 min-w-0 flex-nowrap">
        
        <!-- Back to Executive Master Hub Overview -->
        <a 
          href="/modules/{{ module.route_slug }}" 
          class="px-2.5 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0"
          title="Back to {{ module.name }} Master Hub"
        >
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span>Overview</span>
        </a>

        <div class="h-4 w-px bg-slate-300 dark:bg-white/10 mx-1 shrink-0"></div>

        <!-- Sibling Options belonging EXCLUSIVELY to this Operational Suite -->
        <div class="flex items-center gap-1.5 flex-nowrap">
          {% for card in active_suite.cards %}
            {% set is_active = ('tab=' ~ current_tab in card.url or card.url.endswith('/' ~ current_tab)) %}
            <a 
              href="{{ card.url }}" 
              class="px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 shrink-0 {% if is_active %}{% if active_suite.theme_color == 'emerald' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold shadow-sm{% elif active_suite.theme_color == 'purple' %}bg-purple-500/20 text-purple-400 border border-purple-500/30 font-bold shadow-sm{% elif active_suite.theme_color == 'amber' %}bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold shadow-sm{% elif active_suite.theme_color == 'rose' %}bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold shadow-sm{% else %}bg-blue-500/20 text-blue-400 border border-blue-500/30 font-bold shadow-sm{% endif %}{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-white/5{% endif %}"
              {% if is_active %}data-subnav-active="true"{% endif %}
            >
              <i data-lucide="{{ card.icon }}" class="w-3.5 h-3.5"></i>
              <span>{{ card.title }}</span>
            </a>
          {% endfor %}
        </div>

      </div>
    </div>

    <!-- Right Gradient Fade Mask -->
    <div id="subnav-fade-right" class="subnav-fade-mask absolute right-0 top-0 bottom-0 w-10 bg-gradient-to-l from-white dark:from-[#161A23] to-transparent z-20 pointer-events-none rounded-r-2xl opacity-0 transition-opacity duration-200" style="display: none;"></div>

    <!-- Right Navigation Chevron (Auto-hidden when at end or no overflow) -->
    <button 
      id="subnav-btn-right"
      type="button"
      onclick="scrollSuiteSubnav('right')"
      class="subnav-nav-btn absolute right-1 z-30 w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-white/95 dark:bg-slate-800/95 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 dark:hover:text-white border border-slate-200 dark:border-white/15 text-slate-700 dark:text-slate-200 shadow-md flex items-center justify-center transition-all duration-200 cursor-pointer disabled:opacity-0 disabled:pointer-events-none hover:scale-105 active:scale-95 shrink-0"
      title="More Pages"
      style="display: none;"
    >
      <i data-lucide="chevron-right" class="w-4 h-4"></i>
    </button>

  </div>
{% endif %}
